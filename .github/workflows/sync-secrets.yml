name: Sync secrets to Navic

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Copy secrets
        env:
          GH_TOKEN: ${{ secrets.NAVIC_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          printf '%s' "$KEYSTORE_BASE64" | gh secret set KEYSTORE_BASE64 -R drakeerv/Navic
          printf '%s' "$KEYSTORE_PASSWORD" | gh secret set KEYSTORE_PASSWORD -R drakeerv/Navic
          printf '%s' "$KEY_ALIAS" | gh secret set KEY_ALIAS -R drakeerv/Navic
          printf '%s' "$KEY_PASSWORD" | gh secret set KEY_PASSWORD -R drakeerv/Navic
          echo "Copied secrets to Navic."

      - name: Remove temporary token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.NAVIC_TOKEN }}
        run: gh api -X DELETE repos/drakeerv/squeen/actions/secrets/NAVIC_TOKEN
